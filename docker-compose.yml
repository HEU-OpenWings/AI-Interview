services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: bole-api:0.5.dev
    container_name: api-dev
    working_dir: /app
    volumes:
      - ./server:/app/server
      - ./src:/app/src
      - ./saves:/app/saves
      - ./test:/app/test
      - ./scripts:/app/scripts
      - ./.env:/app/.env
      - ${MODEL_DIR:-./models}:/models  # 使用默认值处理未定义的环境变量
    ports:
      - "5050:5050"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    # region api_envs
    environment:
      - HOST_IP=${HOST_IP:-}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_interview}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RUN_EVENTS_STREAM_TTL_SECONDS=${RUN_EVENTS_STREAM_TTL_SECONDS:-7200}
      - RUN_CANCEL_KEY_TTL_SECONDS=${RUN_CANCEL_KEY_TTL_SECONDS:-1800}
      - MINERU_VL_SERVER=${MINERU_VL_SERVER:-http://mineru-vllm-server:30000}
      - MINERU_API_URI=${MINERU_API_URI:-http://mineru-api:30001}
      - PADDLEX_URI=${PADDLEX_URI:-http://paddlex:8080}
      - MINIO_URI=${MINIO_URI:-http://minio:9000}
      - MODEL_DIR_IN_DOCKER=/models
      - RUNNING_IN_DOCKER=true
      - NO_PROXY=localhost,127.0.0.1,minio,mineru,paddlex,api.siliconflow.cn
      - no_proxy=localhost,127.0.0.1,minio,mineru,paddlex,api.siliconflow.cn
      - OJ_API_BASE_URL=${OJ_API_BASE_URL:-http://oj-backend.local:8000/api}
      - OJ_JUDGE_SERVER_URL=${OJ_JUDGE_SERVER_URL:-http://oj-judge-server:12358}
      - OJ_USERNAME=${OJ_USERNAME:-root}
      - OJ_PASSWORD=${OJ_PASSWORD:-rootroot}
    # endregion api_envs
    command: uv run --no-dev uvicorn server.main:app --host 0.0.0.0 --port 5050 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/api/system/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: bole-api:0.5.dev
    container_name: worker-dev
    working_dir: /app
    volumes:
      - ./server:/app/server
      - ./src:/app/src
      - ./saves:/app/saves
      - ./test:/app/test
      - ./scripts:/app/scripts
      - ./.env:/app/.env
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ${MODEL_DIR:-./models}:/models
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST_IP=${HOST_IP:-}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_interview}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RUN_EVENTS_STREAM_TTL_SECONDS=${RUN_EVENTS_STREAM_TTL_SECONDS:-7200}
      - RUN_CANCEL_KEY_TTL_SECONDS=${RUN_CANCEL_KEY_TTL_SECONDS:-1800}
      - MINERU_VL_SERVER=${MINERU_VL_SERVER:-http://mineru-vllm-server:30000}
      - MINERU_API_URI=${MINERU_API_URI:-http://mineru-api:30001}
      - PADDLEX_URI=${PADDLEX_URI:-http://paddlex:8080}
      - MINIO_URI=${MINIO_URI:-http://minio:9000}
      - MODEL_DIR_IN_DOCKER=/models
      - RUNNING_IN_DOCKER=true
      - NO_PROXY=localhost,127.0.0.1,minio,mineru,paddlex,api.siliconflow.cn
      - no_proxy=localhost,127.0.0.1,minio,mineru,paddlex,api.siliconflow.cn
      - OJ_API_BASE_URL=${OJ_API_BASE_URL:-http://oj-backend.local:8000/api}
      - OJ_JUDGE_SERVER_URL=${OJ_JUDGE_SERVER_URL:-http://oj-judge-server:12358}
      - OJ_USERNAME=${OJ_USERNAME:-root}
      - OJ_PASSWORD=${OJ_PASSWORD:-rootroot}
    command: uv run --no-dev arq server.worker_main.WorkerSettings
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  kb-import:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: bole-api:0.5.dev
    container_name: kb-import-dev
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts
      - ./saves:/app/saves
      - ./.knowledge:/app/.knowledge
      - ./.env:/app/.env
    networks:
      - app-network
    env_file:
      - .env
    command: sh /app/scripts/wait_and_import_interview_knowledge.sh
    restart: "no"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: development
    image: bole-web:0.5.dev
    container_name: web-dev
    volumes:
      - ./web/package.json:/app/package.json
      - ./web/pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/scripts:/app/scripts
      - ./web/index.html:/app/index.html
      - ./web/vite.config.js:/app/vite.config.js
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - app-network
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://api:5050
      - VITE_USE_RUNS_API=${VITE_USE_RUNS_API:-false}
    command: sh -lc "pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com && pnpm run server"
    restart: unless-stopped


  minio:
    container_name: minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./docker/volumes/minio/data:/minio_data
      - ./docker/volumes/minio/config:/root/.minio
    command: minio server /minio_data --address 0.0.0.0:9000 --console-address 0.0.0.0:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ai_interview}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./docker/volumes/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_interview} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/volumes/redis:/data
    networks:
      - app-network
    restart: unless-stopped

  oj-redis:
    image: redis:7-alpine
    container_name: oj-redis
    command: redis-server --appendonly yes
    volumes:
      - ./docker/volumes/oj/redis:/data
    networks:
      - app-network
    restart: unless-stopped

  oj-postgres:
    image: postgres:14-alpine
    container_name: oj-postgres
    environment:
      - POSTGRES_USER=${OJ_POSTGRES_USER:-onlinejudge}
      - POSTGRES_PASSWORD=${OJ_POSTGRES_PASSWORD:-onlinejudge}
      - POSTGRES_DB=${OJ_POSTGRES_DB:-onlinejudge}
    volumes:
      - ./docker/volumes/oj/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OJ_POSTGRES_USER:-onlinejudge} -d ${OJ_POSTGRES_DB:-onlinejudge} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network
    restart: unless-stopped

  oj-judge-server:
    image: registry.cn-hongkong.aliyuncs.com/oj-image/judge:1.6.1
    container_name: oj-judge-server
    entrypoint:
      - /bin/sh
      - -lc
      - |
        (
          while true; do
            .venv/bin/python /app/service.py || true
            sleep 10
          done
        ) &
        exec /app/entrypoint.sh
    read_only: true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp
    environment:
      - SERVICE_URL=http://oj-judge-server:8080
      - BACKEND_URL=http://oj-backend:8000/api/judge_server_heartbeat/
      - TOKEN=${OJ_JUDGE_SERVER_TOKEN:-CHANGE_ME}
    volumes:
      - ./docker/volumes/oj/data/test_case:/test_case:ro
      - ./docker/volumes/oj/log:/log
      - ./docker/volumes/oj/run:/judger
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          ".venv/bin/python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8080), 2); s.close()\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  oj-backend:
    image: registry.cn-hongkong.aliyuncs.com/oj-image/backend:1.6.1
    container_name: oj-backend
    entrypoint:
      - /bin/sh
      - /app/oj_backend_entrypoint.sh
    environment:
      - POSTGRES_DB=${OJ_POSTGRES_DB:-onlinejudge}
      - POSTGRES_USER=${OJ_POSTGRES_USER:-onlinejudge}
      - POSTGRES_PASSWORD=${OJ_POSTGRES_PASSWORD:-onlinejudge}
      - JUDGE_SERVER_TOKEN=${OJ_JUDGE_SERVER_TOKEN:-CHANGE_ME}
    depends_on:
      oj-postgres:
        condition: service_healthy
      oj-redis:
        condition: service_started
      oj-judge-server:
        condition: service_started
    ports:
      - "8088:8000"
    volumes:
      - ./docker/volumes/oj/data:/data
      - ./docker/volumes/oj/data/test_case:/data/test_case
      - ./docker/oj_backend_entrypoint.sh:/app/oj_backend_entrypoint.sh:ro
    networks:
      app-network:
        aliases:
          - oj-backend.local
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 600s
    restart: unless-stopped

  oj-problem-seed:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: bole-api:0.5.dev
    container_name: oj-problem-seed
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./.env:/app/.env
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    networks:
      - app-network
    env_file:
      - .env
    environment:
      - OJ_ADMIN_BASE_URL=http://oj-backend.local:8000
      - OJ_USERNAME=${OJ_USERNAME:-root}
      - OJ_PASSWORD=${OJ_PASSWORD:-rootroot}
    command: >
      sh -lc "until curl -sf http://oj-backend.local:8000/api/profile >/dev/null; do sleep 2; done;
      uv run python /app/scripts/import_interview_problems_to_oj.py"
    restart: "no"
    depends_on:
      api:
        condition: service_started
      oj-backend:
        condition: service_healthy

  oj-freeproblemset-import:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: bole-api:0.5.dev
    container_name: oj-freeproblemset-import
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./.env:/app/.env
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./saves/oj:/app/saves/oj
      - freeproblemset-repo:/app/.codex_tmp/freeproblemset
    networks:
      - app-network
    env_file:
      - .env
    environment:
      - OJ_ADMIN_BASE_URL=http://oj-backend.local:8000
      - OJ_USERNAME=${OJ_USERNAME:-root}
      - OJ_PASSWORD=${OJ_PASSWORD:-rootroot}
      - FREEPROBLEMSET_CLASSIFIER=${FREEPROBLEMSET_CLASSIFIER:-rule}
      - FREEPROBLEMSET_IMPORT_TIMEOUT=${FREEPROBLEMSET_IMPORT_TIMEOUT:-600}
      - FREEPROBLEMSET_IMPORT_CHUNK_SIZE=${FREEPROBLEMSET_IMPORT_CHUNK_SIZE:-200}
      - FREEPROBLEMSET_AUTO_SYNC=${FREEPROBLEMSET_AUTO_SYNC:-true}
      - FREEPROBLEMSET_AUTO_CLASSIFY=${FREEPROBLEMSET_AUTO_CLASSIFY:-true}
      - FREEPROBLEMSET_AUTO_IMPORT=${FREEPROBLEMSET_AUTO_IMPORT:-true}
    command: >
      sh -lc "until curl -sf http://oj-backend.local:8000/api/profile >/dev/null; do sleep 2; done;
      uv run python /app/scripts/import_freeproblemset.py"
    restart: "no"
    depends_on:
      api:
        condition: service_started
      oj-backend:
        condition: service_healthy
      oj-problem-seed:
        condition: service_completed_successfully


  # lastest version: wget https://gcore.jsdelivr.net/gh/opendatalab/MinerU@master/docker/compose.yaml
  mineru-vllm-server:
    build:
      context: .
      dockerfile: docker/mineru.Dockerfile
    image: mineru-vllm:latest
    container_name: mineru-vllm-server
    profiles:
      - all
    env_file:
      - .env
    ports:
      - 30000:30000
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-vllm-server
    command:
      --host 0.0.0.0
      --port 30000
      # parameters for vllm-engine
      # --data-parallel-size 2  # If using multiple GPUs, increase throughput using vllm's multi-GPU parallel mode
      # --gpu-memory-utilization 0.5  # If running on a single GPU and encountering VRAM shortage, reduce the KV cache size by this parameter, if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - app-network
    restart: unless-stopped

  mineru-api:
    build:
      context: .
      dockerfile: docker/mineru.Dockerfile
    image: mineru-vllm:latest
    container_name: mineru-api
    profiles:
      - all
    env_file:
      - .env
    ports:
      - 30001:30001
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 30001
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    restart: unless-stopped
    networks:
      - app-network

  paddlex:
    build:
      context: .
      dockerfile: docker/paddlex.Dockerfile
    image: paddlex:latest
    container_name: paddlex-ocr
    profiles:
      - all
    volumes:
      - ./docker/volumes/paddlex:/paddlex
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  freeproblemset-repo:
